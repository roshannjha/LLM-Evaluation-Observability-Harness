[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "LLM Evaluation & Observability Harness — RAGAS golden data, DeepEval CI gates, Langfuse tracing over a financial-document RAG app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # RAG orchestration + vector store.
    # PINNED to the LangChain 0.3 era: RAGAS 0.2.x hard-imports paths that were
    # removed in langchain-community 0.4 (which is being sunset). See BUILD_LOG.md.
    "langchain==0.3.27",
    "langchain-community==0.3.31",
    "langchain-chroma==0.1.4",
    "langchain-huggingface==0.1.2",
    "langchain-text-splitters==0.3.11",
    "chromadb==0.5.23",
    # local embeddings (no API key required)
    "sentence-transformers>=3.0",
    # corpus download / parsing
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    # config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Heavier eval/observability stack — installed when working on Phases 3-6.
eval = [
    "ragas==0.2.15",
    "deepeval>=1.4",
    "langfuse>=2.50",
    "langchain-openai==0.2.14",
    "datasets>=2.20",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
